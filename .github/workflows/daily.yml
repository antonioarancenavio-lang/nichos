name: Radar de nichos diario

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC ~ 08:00/09:00 hora de Espana segun horario de verano
  workflow_dispatch: {}    # permite lanzarlo a mano desde la pestana Actions

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar Chrome (necesario para el radar de nichos)
        uses: browser-actions/setup-chrome@v1

      - name: Ejecutar radar de nichos
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python track_trends.py

      - name: Ejecutar tendencias dropshipping (EEUU/UK)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python dropship_trends.py

      - name: Guardar datos actualizados
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/history.json data/dropship_trends.json
          git diff --staged --quiet || git commit -m "Actualiza datos $(date +%Y-%m-%d)"
          git push
