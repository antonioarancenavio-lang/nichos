name: Radar de nichos diario

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC ~ 08:00/09:00 hora de Espana segun horario de verano
  workflow_dispatch: {}    # permite lanzarlo a mano desde la pestana Actions
  push:
    branches: [main]
    paths-ignore:          # evita relanzarse a si mismo con sus propios commits de datos
      - "data/**"
      - "keywords.json"
      - "tendencias.html"
      - "categorias.html"
      - "nichos-*.html"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descubrir nichos nuevos
        run: python discover_niches.py

      - name: Instalar Chrome (necesario para el radar de nichos)
        uses: browser-actions/setup-chrome@v1

      - name: Ejecutar radar de nichos (nucleo + candidatos nuevos)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python track_trends.py

      - name: Generar página de tendencias (SEO)
        run: python generate_blog.py

      - name: Guardar datos actualizados
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/history.json data/discarded.json data/pending.json data/last_run.json data/health.json keywords.json tendencias.html categorias.html nichos-*.html
          git diff --staged --quiet || git commit -m "Actualiza datos $(date +%Y-%m-%d)"
          git push
