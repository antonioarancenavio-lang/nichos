name: Radar de nichos diario

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC ~ 08:00/09:00 hora de Espana segun horario de verano
  workflow_dispatch: {}    # permite lanzarlo a mano desde la pestana Actions
  push:
    branches: [main]
    paths-ignore:          # evita relanzarse a si mismo con sus propios commits de datos
      - "data/**"
      - "keywords.json"
      - "tendencias.html"
      - "categorias.html"
      - "nichos-*.html"
      - "nicho-*.html"
      - "sitemap.xml"

permissions:
  contents: write

concurrency:
  group: radar-diario
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descubrir nichos nuevos
        run: python discover_niches.py

      - name: Instalar Chrome (necesario para el radar de nichos)
        uses: browser-actions/setup-chrome@v1

      # trendspyg (>=1.6.0) puede reutilizar la cookie de sesion de Google
      # entre ejecuciones ("returning visitor") si se le da un fichero
      # persistente -- sin esto, cada Action empieza desde cero y es tratada
      # como visitante nueva, lo que Google bloquea mucho antes en runners
      # compartidos como los de GitHub Actions.
      - name: Restaurar cookie de Google Trends (sesion "returning visitor")
        uses: actions/cache@v4
        with:
          path: .trendspyg-cookies.json
          key: trendspyg-cookies-${{ github.run_id }}
          restore-keys: trendspyg-cookies-

      - name: Ejecutar radar de nichos (nucleo + candidatos nuevos)
        timeout-minutes: 25
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRENDSPYG_COOKIES: ${{ github.workspace }}/.trendspyg-cookies.json
        run: python track_trends.py

      - name: Generar página de tendencias (SEO)
        run: python generate_blog.py

      - name: Generar artículos completos (Premium)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_articles.py

      - name: Enviar alertas de oportunidad temprana (Premium)
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: python alert_premium.py

      - name: Guardar datos actualizados
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          # git add con rutas literales falla (exit 128, "pathspec did not
          # match any files") si el fichero no existe todavia -- varios de
          # estos son condicionales (p.ej. data/articles.json solo se crea
          # si ANTHROPIC_API_KEY esta puesta y se genero algun articulo;
          # data/history.json.bak solo aparece a partir del 2o guardado).
          # Se filtra a los que realmente existen para no abortar el commit.
          FILES="data/history.json data/history.json.bak data/discarded.json data/pending.json data/last_run.json data/articles.json data/last_alert_sent.json keywords.json tendencias.html categorias.html sitemap.xml"
          for f in $FILES nicho-*.html nichos-*.html; do
            [ -e "$f" ] && git add "$f"
          done
          git diff --staged --quiet || git commit -m "Actualiza datos $(date +%Y-%m-%d)"
          git push
