name: Radar de nichos diario

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC ~ 08:00/09:00 hora de Espana segun horario de verano -- radar diario
    - cron: "30 7 * * 1"  # lunes, media hora despues -- dispara ademas el resumen semanal por email
  workflow_dispatch:
    inputs:
      send_weekly_digest:
        description: "Enviar tambien el resumen semanal (para probarlo a mano)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:          # evita relanzarse a si mismo con sus propios commits de datos
      - "data/**"
      - "keywords.json"
      - "tendencias.html"
      - "categorias.html"
      - "nichos-*.html"
      - "nicho-*.html"
      - "sitemap.xml"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    # Red de seguridad extra ademas del disyuntor de track_trends.py: si
    # algo se cuelga por completo (Chrome no responde, etc.) esto corta
    # la ejecucion en vez de dejarla colgada horas. Con el disyuntor ya
    # activo, un dia normal (incluso uno malo, con Google bloqueando) no
    # deberia acercarse a este limite.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historial completo: hace falta para que el "git pull --rebase" de mas abajo funcione bien si hiciera falta

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Descubrir nichos nuevos
        continue-on-error: true   # extra, no nucleo: si falla, se sigue con el pending.json que ya hubiera
        run: python discover_niches.py

      - name: Instalar Chrome (necesario para el radar de nichos)
        uses: browser-actions/setup-chrome@v1

      - name: Ejecutar radar de nichos (nucleo + candidatos nuevos)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python track_trends.py

      - name: Generar página de tendencias (SEO)
        run: python generate_blog.py

      - name: Generar artículos completos (Premium)
        continue-on-error: true   # extra Premium, no nucleo: un fallo aqui no debe impedir publicar el sitio
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_articles.py

      - name: Enviar alertas de oportunidad temprana (Premium)
        continue-on-error: true   # extra Premium, no nucleo: un fallo aqui no debe impedir publicar el sitio
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: python alert_premium.py

      - name: Enviar resumen semanal gratuito por email
        # Solo corre con el cron de los lunes, o a mano si marcas la casilla
        # al lanzar el workflow manualmente -- entre semana no hace nada.
        if: (github.event_name == 'schedule' && github.event.schedule == '30 7 * * 1') || (github.event_name == 'workflow_dispatch' && github.event.inputs.send_weekly_digest == 'true')
        continue-on-error: true   # extra, no nucleo: un fallo aqui no debe impedir publicar el sitio
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: python weekly_digest.py

      - name: Guardar datos actualizados
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/history.json data/history.json.bak data/discarded.json data/pending.json data/last_run.json data/articles.json data/last_alert_sent.json data/last_digest_sent.json keywords.json tendencias.html categorias.html nichos-*.html nicho-*.html sitemap.xml
          git diff --staged --quiet || git commit -m "Actualiza datos $(date +%Y-%m-%d)"
          # Reintento con rebase: si entre el checkout y ahora otra ejecucion
          # (o un push manual) ha subido un commit nuevo, un "git push" a
          # secas fallaria por no-fast-forward. Se reintenta una vez
          # rebasando encima de lo nuevo antes de rendirse.
          git push || (git pull --rebase origin main && git push)
